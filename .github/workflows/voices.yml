# KatchTV's own Read-button voices, Female 1 and Male 1 (Wonder 2026-11-07).
# Every day: reads the articles listeners asked for (https://katchtv.com/api/voice, plus requests/*.json), voices them with
# Kokoro (free, open source, make_voices.py) and puts the audio on the "audio" branch. katchtv.com/v/... plays it through Cloudflare.
# NO COST: this repo is PUBLIC, and GitHub runs jobs on its standard runners in public repos free of charge.
# The first step stops the job if this repo is ever made private (private repos would use paid minutes).
name: Voices (Read button)
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["requests/**", "make_voices.py"]
permissions:
  contents: write
  actions: write
concurrency:
  group: voices
  cancel-in-progress: false
env:
  RUN_SECONDS: "19800"
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keep this daily job switched on
        # GitHub pauses scheduled jobs in public repos after 60 days with no activity. Re-enabling it on every run resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/voices.yml/enable" && echo "Daily job kept on" || echo "::warning::Could not refresh the daily job"
      - uses: actions/checkout@v4
      - name: Free check and requests
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RECIPE: ${{ secrets.VOICE_RECIPE != '' }}
        run: |
          priv=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$priv" != "false" ]; then echo "::warning::This repo is private, so jobs would cost money. Stopping."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$HAS_RECIPE" != "true" ]; then echo "::notice::The VOICE_RECIPE secret is not set yet, nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          curl -sf https://katchtv.com/api/voice -o "$RUNNER_TEMP/api.json" || echo '{"requests":[]}' > "$RUNNER_TEMP/api.json"
          python3 - "$RUNNER_TEMP/api.json" "$RUNNER_TEMP/req.json" <<'PY'
          import json, sys, glob
          def load(f):
              try: d = json.load(open(f))
              except Exception: return []
              return d.get('requests', []) if isinstance(d, dict) else d
          out = {}
          for f in sorted(glob.glob('requests/*.json')) + [sys.argv[1]]:   # the live site wins
              for r in load(f):
                  if isinstance(r, dict) and r.get('slug') and isinstance(r.get('parts'), list): out[r['slug']] = {'slug': r['slug'], 'parts': r['parts']}
          json.dump(list(out.values()), open(sys.argv[2], 'w')); print('Requested articles:', len(out))
          PY
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - name: Audio branch
        if: steps.plan.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q "$RUNNER_TEMP/va" && cd "$RUNNER_TEMP/va"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin audio; then git checkout -q -b audio FETCH_HEAD; else
            git checkout -q --orphan audio; mkdir -p v; touch .nojekyll
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
            printf '<!doctype html><title>KatchTV voices</title><p>Audio for the Read button on <a href="https://katchtv.com/blog">katchtv.com</a>.</p>\n' > index.html; fi
          todo=$(python3 "$GITHUB_WORKSPACE/make_voices.py" "$RUNNER_TEMP/req.json" v --todo)
          echo "Articles to voice: $todo"; echo "TODO=$todo" >> "$GITHUB_ENV"
      - name: Sentence cache
        if: steps.plan.outputs.go == 'yes' && env.TODO != '0'
        uses: actions/cache@v4
        with:
          path: ~/kk/cache
          key: voices-${{ github.run_id }}
          restore-keys: voices-
      - name: Make the voices
        if: steps.plan.outputs.go == 'yes' && env.TODO != '0'
        env:
          VOICE_RECIPE: ${{ secrets.VOICE_RECIPE }}
        run: |
          pip install -q kokoro-onnx soundfile
          mkdir -p ~/kk && cd ~/kk
          curl -sSL -o kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          cd "$RUNNER_TEMP/va" && python3 "$GITHUB_WORKSPACE/make_voices.py" "$RUNNER_TEMP/req.json" v "$RUN_SECONDS"
          git add -A
          if ! git diff --cached --quiet; then
            # keep only the newest audio (one commit), so the repo never grows
            git checkout -q --orphan fresh
            git -c user.name=katchtv-bot -c user.email=bot@katchtv.com commit -q -m "voices: $(date -u +%F)"
            git push -q -f origin fresh:audio
          fi
